---
openapi: "3.0.3"
info:
  title: "Postmark API"
  version: "2026-03-10-docs-reconstruction"
  description: "Merged from the live Postmark API Explorer Swagger plus developer
    docs and llms.txt patches as of 2026-03-10."
servers:
  - url: "https://api.postmarkapp.com"
    description: "Postmark API"
tags:
  - name: "Email"
  - name: "Messages"
  - name: "Bounces"
  - name: "Templates"
  - name: "Message Streams"
  - name: "Webhooks"
  - name: "Suppressions"
  - name: "Server Configuration"
  - name: "Stats"
  - name: "Inbound Rules"
  - name: "Servers"
  - name: "Domains"
  - name: "Sender Signatures"
  - name: "Data Removal"
paths:
  /bounces:
    get:
      operationId: "getBounces"
      tags:
        - "Bounces"
      summary: "Get bounces"
      parameters:
        - name: "count"
          in: "query"
          description: "Number of bounces to return per request. Max 500."
          required: true
          schema:
            type: "integer"
            maximum: 500
        - name: "offset"
          description: "Number of bounces to skip."
          in: "query"
          required: true
          schema:
            type: "integer"
        - name: "type"
          description: "Filter by type of bounce"
          in: "query"
          schema:
            type: "string"
            enum:
              - "HardBounce"
              - "Transient"
              - "Unsubscribe"
              - "Subscribe"
              - "AutoResponder"
              - "AddressChange"
              - "DnsError"
              - "SpamNotification"
              - "OpenRelayTest"
              - "Unknown"
              - "SoftBounce"
              - "VirusNotification"
              - "MailFrontier Matador."
              - "BadEmailAddress"
              - "SpamComplaint"
              - "ManuallyDeactivated"
              - "Unconfirmed"
              - "Blocked"
              - "SMTPApiError"
              - "InboundError"
              - "DMARCPolicy"
              - "TemplateRenderingFailed"
        - name: "inactive"
          description: "Filter by emails that were deactivated by Postmark due to the
            bounce. Set to true or false. If this isn't specified it will return
            both active and inactive."
          in: "query"
          schema:
            type: "boolean"
        - name: "emailFilter"
          in: "query"
          description: "Filter by email address"
          schema:
            type: "string"
            format: "email"
        - name: "messageID"
          description: "Filter by messageID"
          in: "query"
          schema:
            type: "string"
        - name: "tag"
          description: "Filter by tag"
          in: "query"
          schema:
            type: "string"
        - name: "todate"
          in: "query"
          description: "Filter messages up to the date specified. e.g. `2014-02-01`"
          schema:
            type: "string"
            format: "date"
        - name: "fromdate"
          description: "Filter messages starting from the date specified. e.g. `2014-02-01`"
          in: "query"
          schema:
            type: "string"
            format: "date"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BounceSearchResponse"
        422:
          $ref: "#/components/responses/422"
        500:
          $ref: "#/components/responses/500"
      security:
        - serverToken: []
  /bounces/{bounceid}:
    get:
      operationId: "getSingleBounce"
