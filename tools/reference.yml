  /domains/{domainid}/rotatedkim:
    post:
      operationId: "rotateDKIMKeyForDomain"
      tags:
        - "Domains"
      summary: "Rotate DKIM Key"
      description: "Creates a new DKIM key to replace your current key. Until the DNS
        entries are confirmed,

        the new values will be in the `DKIMPendingHost` and
        `DKIMPendingTextValue` fields.

        After the new DKIM value is verified in DNS, the pending values will
        migrate to

        `DKIMTextValue` and `DKIMPendingTextValue` and Postmark will begin to
        sign emails

        with the new DKIM key.\n"
      parameters:
        - name: "domainid"
          in: "path"
          description: "The ID for the Sender Signature for which a new DKIM Key should be
            generated."
          required: true
          schema:
            type: "integer"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DKIMRotationResponse"
        422:
          $ref: "#/components/responses/422"
        500:
          $ref: "#/components/responses/500"
      security:
        - accountToken: []
